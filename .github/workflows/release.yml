name: Release

# Every push or merge to main bumps the minor version (v0.1.0 -> v0.2.0 -> ...),
# tags the commit, builds the Android app and publishes a GitHub release with
# the APK and the app bundle attached.
#
# Tagging and building happen in the same workflow on purpose: a tag pushed with
# the default GITHUB_TOKEN would not trigger another workflow.
on:
  push:
    branches: [main]

permissions:
  contents: write

# One release at a time, so two quick merges never compute the same version.
concurrency:
  group: release
  cancel-in-progress: false

env:
  FLUTTER_VERSION: "3.50.1"

jobs:
  release:
    name: Tag, build & publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # needed to see the existing tags

      - name: Compute next version
        id: version
        run: |
          latest=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n 1)
          latest=${latest:-v0.0.0}
          IFS=. read -r major minor _patch <<< "${latest#v}"
          next="v${major}.$((minor + 1)).0"
          echo "Latest: ${latest} -> next: ${next}"
          echo "tag=${next}" >> "$GITHUB_OUTPUT"
          echo "name=${next#v}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Analyze & test
        run: |
          flutter analyze
          flutter test

      - name: Build release APK and app bundle
        run: |
          flutter build apk --release \
            --build-name=${{ steps.version.outputs.name }} \
            --build-number=${{ github.run_number }} \
            --dart-define=API_BASE_URL=${{ vars.API_BASE_URL || 'https://classicum.fly.dev' }}
          flutter build appbundle --release \
            --build-name=${{ steps.version.outputs.name }} \
            --build-number=${{ github.run_number }} \
            --dart-define=API_BASE_URL=${{ vars.API_BASE_URL || 'https://classicum.fly.dev' }}

      # Creates the tag on this commit and the release in one step.
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          make_latest: true
          files: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
